<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Cleaner - テキスト整形ツール</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Text Cleaner</h1>

    <!-- オプション選択エリア（初期選択を「カタカナ変換なし」に変更し、チェックをすべて外す） -->
    <div class="options-grid">
      <label><input type="checkbox" id="optAlphaNum"> 英数字を半角に統一</label>

      <!-- カタカナ変換の選択（デフォルトは「変換なし」に） -->
      <div class="radio-group">
        <label><input type="radio" name="optKanaMode" value="none" checked> カタカナ変換なし</label>
        <label><input type="radio" name="optKanaMode" value="toFull"> 半角ｶﾀｶﾅ → 全角カタカナ</label>
        <label><input type="radio" name="optKanaMode" value="toHalf"> 全角カタカナ → 半角ｶﾀｶﾅ</label>
      </div>

      <label><input type="checkbox" id="optZip"> 郵便番号にハイフン「-」挿入</label>
      <label><input type="checkbox" id="optPhoneHyphen"> 電話番号のハイフン「-」除去</label>
      <label><input type="checkbox" id="optAddressDash"> 住所のハイフン類を「-」に統一</label>
      <label><input type="checkbox" id="optRemoveCharSpace"> 文字間の無駄なスペース除去</label>
      <label><input type="checkbox" id="optSpace"> 連続スペースを半角1つに縮小</label>
      <label><input type="checkbox" id="optTrim"> 各行の前後空白を除去</label>
      <label><input type="checkbox" id="optSpaceToNewline"> スペース（全角・半角）を改行に変換</label>

      <!-- 改行を1行に連結エリア（2行構成） -->
      <div class="radio-group"
        style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">
        <div>
          <label><input type="checkbox" id="optJoinLines"> 改行を1行に連結</label>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-left: 20px;">
          <span style="font-size:0.9rem; color:#cbd5e1;">区切り文字：</span>
          <label><input type="radio" name="joinDelimiter" value="" checked> なし</label>
          <label><input type="radio" name="joinDelimiter" value=","> 読点「,」</label>
          <label><input type="radio" name="joinDelimiter" value="、"> 読点「、」</label>
          <label><input type="radio" name="joinDelimiter" value="・"> 中黒「・」</label>
          <label><input type="radio" name="joinDelimiter" value="："> コロン「：」</label>
          <label><input type="radio" name="joinDelimiter" value=" "> 半角SP</label>
          <label><input type="radio" name="joinDelimiter" value=" "> 全角SP</label>
        </div>
      </div>
    </div> <!-- .options-grid 閉じタグ -->

    <!-- CSV取り込みエリア -->
    <div class="file-panel">
      <h3>CSVファイル処理</h3>
      <div class="file-inputs">
        <input type="file" id="csvFileInput" accept=".csv, .txt">
        <button id="downloadCsvBtn" class="btn-secondary" disabled>整形済みCSVをダウンロード</button>
      </div>
      <p class="file-hint">※CSVを取り込むと自動で整形され、ダウンロード可能になります。</p>
    </div>

    <!-- テキストエリア（入出力） -->
    <div class="io-area">
      <div class="field">
        <label for="inputText">変換前テキスト</label>
        <textarea id="inputText" placeholder="ここにテキストを貼り付け、またはCSVファイルを上から読み込みます"></textarea>
      </div>
      <div class="field">
        <label for="outputText">変換後テキスト</label>
        <textarea id="outputText" placeholder="整形結果がここに表示されます"></textarea>
      </div>
    </div>

    <!-- アクションボタン -->
    <div class="actions">
      <button id="cleanBtn" class="btn-primary">整形する</button>
      <button id="copyBtn" class="btn-secondary">コピー</button>
      <button id="clearBtn" class="btn-danger">クリア</button>
    </div>
  </div> <!-- .container 閉じタグ -->

  <script src="script.js"></script>
</body>

</html>
