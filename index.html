<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Cleaner - テキスト整形ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Text Cleaner</h1>

    <!-- オプション選択エリア -->
    <div class="options-panel">
      <h3>変換オプション</h3>
      <div class="options-grid">
        <label><input type="checkbox" id="optAlphaNum" checked> 英数字を半角に統一</label>
        
        <!-- カタカナ変換の選択 -->
        <div class="radio-group">
          <label><input type="radio" name="optKanaMode" value="none"> カタカナ変換なし</label>
          <label><input type="radio" name="optKanaMode" value="toFull" checked> 半角ｶﾀｶﾅ → 全角カタカナ</label>
          <label><input type="radio" name="optKanaMode" value="toHalf"> 全角カタカナ → 半角ｶﾀｶﾅ</label>
        </div>

        <label><input type="checkbox" id="optZip"> 郵便番号にハイフン挿入（0000000 → 000-0000）</label>
        <label><input type="checkbox" id="optPhoneHyphen"> 電話番号のハイフン除去</label>
        <label><input type="checkbox" id="optAddressDash"> 住所のダッシュ・ハイフン記号を「-」に統一</label>
        <label><input type="checkbox" id="optRemoveCharSpace" checked> 文字間の無駄なスペース除去</label>
        <label><input type="checkbox" id="optSpace" checked> 連続スペースを半角1つに縮小</label>
        <label><input type="checkbox" id="optTrim"> 各行の前後空白を除去</label>
        <label><input type="checkbox" id="optRemoveLineBreaks"> 改行を全削除して1行に連結</label>
      </div>
    </div>

    <!-- CSV取り込みエリア -->
    <div class="file-panel">
      <h3>CSVファイル処理</h3>
      <div class="file-inputs">
        <input type="file" id="csvFileInput" accept=".csv, .txt">
        <button id="downloadCsvBtn" class="btn-secondary" disabled>整形済みCSVをダウンロード</button>
      </div>
      <p class="file-hint">※CSVを取り込むと自動で整形され、ダウンロード可能になります。</p>
    </div>

    <!-- テキストエリア（入出力） -->
    <div class="io-area">
      <div class="field">
        <label for="inputText">変換前テキスト</label>
        <textarea id="inputText" placeholder="ここにテキストを貼り付け、またはCSVファイルを上から読み込みます"></textarea>
      </div>
      <div class="field">
        <label for="outputText">変換後テキスト</label>
        <textarea id="outputText" readonly placeholder="整形結果がここに表示されます"></textarea>
      </div>
    </div>

    <!-- アクションボタン -->
    <div class="actions">
      <button id="cleanBtn" class="btn-primary">整形する</button>
      <button id="copyBtn" class="btn-secondary">コピー</button>
      <button id="clearBtn" class="btn-danger">クリア</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
